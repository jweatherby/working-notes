[package]
name = "wonos-desktop"
version = "0.0.0"
description = "Wonos desktop app: a window on the local Wonos server"
edition = "2021"
publish = false

[[bin]]
name = "wonos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
