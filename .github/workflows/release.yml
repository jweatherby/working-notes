# Publishes the plugin after CI passes on main, when the plugin version is new
# (set it with `bun run release:version <x.y.z>`):
#   1. builds the standalone macOS plugin (scripts/release/build.ts) and smoke-tests it
#   2. force-pushes the built plugin to the `dist` branch, which marketplace.json points
#      Claude Code and Cowork at
#   3. creates GitHub release v<version> with the zip, for Claude desktop Chat uploads
# The release tag is created last, so a failed run is retried by re-running it.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  BUN_VERSION: 1.3.13

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Decide
        id: plan
        run: bun scripts/release/plan.ts

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    # Apple silicon. Intel Macs would need a darwin-x64 build on an Intel runner.
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate the Prisma client
        run: bunx prisma generate

      - name: Build the standalone plugin
        run: bun run release:build --target darwin-arm64

      - name: Smoke test
        run: bun run release:smoke dist/plugin

      # A signed record that this workflow built the binary from RELEASE_SHA, so anyone
      # (or an organisation's reviewer) can check a copy with
      # `gh attestation verify <binary> --repo <owner>/<repo>`.
      - name: Attest the binary's provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/plugin/server/wnotes-darwin-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            dist/plugin
            dist/working-notes-*.zip
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: dist

      - name: Publish the built plugin to the dist branch
        run: |
          # The plugin sits at the branch root: Cowork's marketplace sync ignores a
          # source `path` and requires .claude-plugin/plugin.json at the root.
          site=$(mktemp -d)
          cp -R dist/plugin/. "$site/"
          test -f "$site/.claude-plugin/plugin.json"
          cd "$site"
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Working Notes $VERSION, built from $RELEASE_SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist

      - name: Create the GitHub release
        run: |
          gh release create "v$VERSION" dist/working-notes-*.zip \
            --target "$RELEASE_SHA" \
            --title "Working Notes $VERSION" \
            --generate-notes
