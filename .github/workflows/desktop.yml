# Builds the desktop app (desktop/, Tauri 2) for macOS, Windows and Linux, and keeps
# the installers as workflow artifacts. Run it by hand from the Actions tab: it isn't
# part of the release yet, and the installers aren't signed, so macOS and Windows warn
# before opening them.
#   macOS: .dmg and .app   Windows: .msi and setup .exe   Linux: .deb and .AppImage
name: Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.13

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-latest }
          - { target: windows-x64, os: windows-latest }
          - { target: linux-x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate the Prisma client
        run: bunx prisma generate

      # The same binary the plugin ships, which the app bundles as its sidecar.
      - name: Build the wnotes binary
        run: bun run release:build --target ${{ matrix.target }}

      - name: Smoke test the binary
        run: bun run release:smoke dist/plugin

      # Tauri's build script needs the sidecar in place, so tests come after this.
      - name: Put the binary in the desktop app
        run: bun run desktop:prepare

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Build the desktop app
        run: bun run desktop:build

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
